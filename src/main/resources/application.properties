
 spring.application.name=guesthouse-customer-service-CI

 # Port -- Railway provides PORT automatically, fallback to 8080
 server.port=${PORT:8080}

 # Datasource -- read from environment when deploying (defaults for local/k8s)
 # For Railway you can set the following env vars: DB_URL, DB_USERNAME, DB_PASSWORD
 # The placeholders below allow flexible providers (MySQL, Postgres, etc.)
 spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:customer-db}:${DB_PORT:3306}/${DB_NAME:customerdb}}
 spring.datasource.username=${DB_USERNAME:root}
 spring.datasource.password=${DB_PASSWORD:root}
 spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

 # Hibernate dialect can be overridden if you use another DB (e.g. Postgres)
 spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

 booking-service.base-url=http://booking-service:8081

 spring.jpa.hibernate.ddl-auto=update
