
 spring.application.name=guesthouse-customer-service-CI

 # Port -- Railway provides PORT automatically, fallback to 8080
 server.port=${PORT:8080}

 # Datasource -- read from environment when deploying (defaults for local/k8s)
 # Railway commonly provides SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
 # To be flexible we accept both the SPRING_* names and legacy DB_* names (SPRING_* takes precedence).
 # Examples you can set in Railway: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
 spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:customer-db}:${DB_PORT:3306}/${DB_NAME:customerdb}}}
 spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
 spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
 spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:${DB_DRIVER:com.mysql.cj.jdbc.Driver}}

 # Hibernate dialect can be overridden if you use another DB (e.g. Postgres)
 spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

 # Booking service base URL (configurable via env var BOOKING_SERVICE_BASE_URL). Prefer internal service name when
 # running inside Railway/Kubernetes: e.g. http://booking-service:8080
 booking-service.base-url=${BOOKING_SERVICE_BASE_URL:http://booking-service:8080}

 spring.jpa.hibernate.ddl-auto=update
